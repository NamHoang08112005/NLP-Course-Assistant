[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-assistant"
version = "0.1.0"
description = "NLP Course Assistant assignment scaffold"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
course-assistant = "course_assistant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
